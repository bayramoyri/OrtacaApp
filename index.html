<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortaca App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        /* Basic Reset */
        body, h1, h2, h3, p { margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; }
        /* Header Styles */
        header { background: linear-gradient(to right, #4CAF50, #81C784); padding: 20px; text-align: center; }
        nav a { margin: 0 15px; color: white; text-decoration: none; }
        /* Layout Styles */
        .container { display: flex; }
        .sidebar { width: 200px; padding: 15px; background: #f0f0f0; }
        .map { flex: 1; height: 500px; }
        .info-panel { padding: 15px; background: #ffffff; }
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgb(0,0,0); opacity: 0.5; }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#places">Places</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <div class="container">
        <div class="sidebar">
            <h2>Categories</h2>
            <ul>
                <li>Restaurants</li>
                <li>Parks</li>
                <li>Museums</li>
                <!-- More categories -->
            </ul>
        </div>
        <div class="map" id="map"></div>
        <div class="info-panel">
            <h2>Place Information</h2>
            <p>Select a place on the map to see details.</p>
        </div>
    </div>
    <!-- Modal for Adding Places -->
    <div id="addPlaceModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('addPlaceModal').style.display='none'" style="cursor:pointer;">&times;</span>
            <h2>Add Place</h2>
            <form>
                <label for="placeName">Place Name:</label>
                <input type="text" id="placeName" required>
                <button type="submit">Add</button>
            </form>
        </div>
    </div>
    <!-- Leaflet JS and Initialization -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([36.8345, 28.6416], 13); // Ortaca coordinates
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        // Implement marker and modal functionality here
    </script>
</body>
</html>
