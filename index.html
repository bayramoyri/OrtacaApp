<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrtacaApp - Ortaca Haritası</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-section">
                <h1><i class="fas fa-map"></i> OrtacaApp</h1>
                <p>Ortaca'nın Rehberi</p>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Mekan ara...">
                <button onclick="searchPlace()"><i class="fas fa-search"></i></button>
            </div>
            <div class="user-section">
                <button onclick="toggleProfile()" class="profile-btn">
                    <i class="fas fa-user-circle"></i> Profil
                </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <nav class="categories">
                    <h3>Kategoriler</h3>
                    <button class="category-btn active" onclick="filterByCategory('all')">
                        <i class="fas fa-th"></i> Tümü
                    </button>
                    <button class="category-btn" onclick="filterByCategory('restaurant')">
                        <i class="fas fa-utensils"></i> Restoranlar
                    </button>
                    <button class="category-btn" onclick="filterByCategory('cafe')">
                        <i class="fas fa-coffee"></i> Kahve Dükkanları
                    </button>
                    <button class="category-btn" onclick="filterByCategory('hotel')">
                        <i class="fas fa-hotel"></i> Oteller
                    </button>
                    <button class="category-btn" onclick="filterByCategory('gas')">
                        <i class="fas fa-gas-pump"></i> Benzin İstasyonları
                    </button>
                    <button class="category-btn" onclick="filterByCategory('jewelry')">
                        <i class="fas fa-ring"></i> Kuyumcular
                    </button>
                    <button class="category-btn" onclick="filterByCategory('tourism')">
                        <i class="fas fa-camera"></i> Turistik Yerler
                    </button>
                </nav>

                <div class="featured-section">
                    <h3>Öne Çıkan Mekanlar</h3>
                    <div id="featuredPlaces"></div>
                </div>

                <button class="add-place-btn" onclick="openAddPlaceModal()">
                    <i class="fas fa-plus"></i> Mekan Ekle
                </button>
            </aside>

            <div class="map-container">
                <div id="map"></div>
            </div>

            <aside class="details-panel hidden" id="detailsPanel">
                <button class="close-details" onclick="closeDetailsPanel()">
                    <i class="fas fa-times"></i>
                </button>
                <div id="placeDetails"></div>
            </aside>
        </div>
    </div>

    <div id="addPlaceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddPlaceModal()">&times;</span>
            <h2>Yeni Mekan Ekle</h2>
            <form id="addPlaceForm">
                <input type="text" id="placeName" placeholder="Mekan Adı" required>
                <textarea id="placeDescription" placeholder="Açıklama" required></textarea>
                <select id="placeCategory" required>
                    <option value="">Kategori Seçin</option>
                    <option value="restaurant">Restoran</option>
                    <option value="cafe">Kahve Dükkanı</option>
                    <option value="hotel">Otel</option>
                    <option value="gas">Benzin İstasyonu</option>
                    <option value="jewelry">Kuyumcu</option>
                    <option value="tourism">Turistik Yer</option>
                </select>
                <input type="text" id="placeAddress" placeholder="Adres" required>
                <input type="tel" id="placePhone" placeholder="Telefon">
                <input type="text" id="placeWebsite" placeholder="Website (isteğe bağlı)">
                <div class="modal-buttons">
                    <button type="submit">Mekan Ekle</button>
                    <button type="button" onclick="closeAddPlaceModal()">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRatingModal()">&times;</span>
            <h2>Değerlendirme Yap</h2>
            <form id="ratingForm">
                <div class="rating-stars">
                    <div class="stars" id="starRating">
                        <span class="star" onclick="setRating(1)">★</span>
                        <span class="star" onclick="setRating(2)">★</span>
                        <span class="star" onclick="setRating(3)">★</span>
                        <span class="star" onclick="setRating(4)">★</span>
                        <span class="star" onclick="setRating(5)">★</span>
                    </div>
                    <p id="ratingText">Derecelendirme seçin</p>
                </div>
                <textarea id="reviewComment" placeholder="Yorumunuz..."></textarea>
                <button type="submit">Gönder</button>
            </form>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content profile-modal">
            <span class="close" onclick="closeProfile()">&times;</span>
            <h2>Kullanıcı Profili</h2>
            <div id="profileContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
