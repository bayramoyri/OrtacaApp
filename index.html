<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Modern Web App</title>
    <style>
        /* Add custom animations here */
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto">
        <header class="py-6">
            <h1 class="text-4xl font-bold text-center text-gray-800">Welcome to Ortaca App</h1>
        </header>
        <main class="mb-8">
            <section class="mb-8">
                <h2 class="text-2xl font-semibold text-gray-700">Our Interactive Map</h2>
                <div id="map" class="h-64 w-full mb-4"></div>
            </section>
            <section>
                <h2 class="text-2xl font-semibold text-gray-700">About Us</h2>
                <p class="text-gray-600">
                    This is a modern web application designed with Tailwind CSS, integrated with Leaflet maps,
                    featuring a fully responsive layout.
                </p>
            </section>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([36.5, 28.5], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);
    </script>
</body>
</html>
